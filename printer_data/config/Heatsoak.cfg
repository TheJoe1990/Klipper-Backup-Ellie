# =============================================================================
#  ELLIE HEATSOAK  --  brought inline with Heatsoak_Universal.cfg (2026-08-16)
# =============================================================================
#  Deployed from the fleet-wide template at D:\Projects\Heatsoak_Universal.cfg.
#  Deviations from the template, and why:
#    * Real pause/resume bypass on this printer is PAUSE_BASE/RESUME_BASE
#      (Ellie's own printer.cfg wrappers around the mainsail-config-renamed
#      BASE_PAUSE/BASE_RESUME) -- NOT BASE_PAUSE/BASE_RESUME directly. Confirmed
#      from printer.cfg's [gcode_macro PAUSE_BASE]/[gcode_macro RESUME_BASE]
#      bodies before wiring this in.
#    * No chamber sensor, no MMU -- chamber logic left dormant (chamber_sensor:
#      ""), MMU SUPPORT SECTION deleted entirely.
#    * PRINT_START_BASE only ever reads BED/EXTRUDER (it errors if either is
#      missing) -- so resume_and_start() forwards only those two params
#      instead of the generic LAYER/FILAMENT/EXCLUDE/SURFACE/OAPA/DMGCC set.
#    * Thresholds/park height carried over unchanged from the prior working
#      macro: min_bed_temp_to_trigger=65, min_print_minutes_to_trigger=10,
#      soak_nozzle_temp=150, park_z=5.
#  PRINT_START_BASE's body is Ellie-specific (unchanged from the prior
#  macro): BED_MESH_CLEAR -> heat -> home -> KOMB nozzle clean -> cooldown to
#  150C -> CARTOGRAPHER_TOUCH_HOME -> adaptive bed mesh -> SMART_PARK -> heat
#  to print temp -> LINE_PURGE. This already satisfies the standing "hot
#  re-home + leveling + mesh after soak" requirement.
# =============================================================================


# =============================================================================
#  PRINTER CONFIGURATION  --  edit everything in this section
# =============================================================================

[gcode_macro _HEATSOAK_CFG]
description: Central configuration -- edit here, not in the logic macros

# -- Chamber sensor -----------------------------------------------------------
# No chamber sensor on Ellie -- chamber logic stays fully dormant.
variable_chamber_sensor: ""
variable_chamber_wait_temp: 0.0
variable_skip_if_chamber_within: 0.0

# -- Soak time calculation ----------------------------------------------------
variable_soak_sec_per_print_min: 5.0
variable_soak_default_minutes: 5.0
variable_soak_min_seconds: 300.0
variable_soak_max_seconds: 2700.0

# -- Trigger conditions -------------------------------------------------------
variable_min_bed_temp_to_trigger: 65.0
variable_min_print_minutes_to_trigger: 10.0

# -- Nozzle temperature during soak ------------------------------------------
variable_soak_nozzle_temp: 150.0

# -- Fans during soak ---------------------------------------------------------
variable_soak_part_fan_speed: 0.0
variable_soak_fans: []

# -- Park position ------------------------------------------------------------
variable_park_z: 5.0

gcode:
    # Config-only macro -- never call directly.


# =============================================================================
#  USER HOOK: PRINTER_HEATSOAK_PARK
#  Default (bed centre at park_z) matches Ellie's prior park behavior exactly
#  -- no override needed.
# =============================================================================

[gcode_macro PRINTER_HEATSOAK_PARK]
description: Park the toolhead for heatsoak. Override to customise position.
gcode:
    {% set cfg = printer["gcode_macro _HEATSOAK_CFG"] %}
    {% if printer.toolhead.homed_axes|lower == "xyz" %}
        {% set cx = (printer.toolhead.axis_maximum.x|float) / 2.0 %}
        {% set cy = (printer.toolhead.axis_maximum.y|float) / 2.0 %}
        G90
        G1 Z{cfg.park_z} F1800
        G1 X{cx} Y{cy} F6000
    {% endif %}


# =============================================================================
#  STARTUP CLEANUP
#  Stale heatsoak_active/state from before a Klipper restart can never be a
#  real continuable soak -- the delayed_gcode timer chain doesn't survive a
#  restart. Ellie's prior macro had no equivalent of this.
# =============================================================================

[delayed_gcode _HEATSOAK_STARTUP_CLEAR]
initial_duration: 2
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.heatsoak_active or (st.state and (st.state|string) != "{}") %}
        RESPOND TYPE=echo MSG="Heatsoak: clearing stale active state left over from before this restart"
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
    {% endif %}


# =============================================================================
#  PHYSICAL PREP  --  fires via delayed_gcode so popup appears first
# =============================================================================

[delayed_gcode _HEATSOAK_PREP]
gcode:
    {% set st  = printer["gcode_macro PRINT_START"] %}
    {% set cfg = printer["gcode_macro _HEATSOAK_CFG"] %}

    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {% set bed = st.state.get("bed", 60)|float %}
        {% set noz = cfg.soak_nozzle_temp|float %}

        M140 S{bed}

        {% set soak_timeout = (cfg.soak_max_seconds|float + 600)|int %}
        SET_IDLE_TIMEOUT TIMEOUT={soak_timeout}

        {% for fan_entry in cfg.soak_fans %}
            SET_FAN_SPEED FAN={fan_entry[0]} SPEED={fan_entry[1]}
        {% endfor %}

        {% if cfg.soak_part_fan_speed|float > 0 %}
            M106 S{(cfg.soak_part_fan_speed|float * 255)|int}
        {% else %}
            M107
        {% endif %}

        {% if printer.toolhead.homed_axes|lower != "xyz" %}
            G28
        {% endif %}

        M190 S{bed}

        {% if noz > 0 %}
            M109 S{noz}
        {% endif %}

        PRINTER_HEATSOAK_PARK

        RESPOND TYPE=echo MSG="Heatsoak: bed at {bed}C, parked. Countdown running."
    {% endif %}


# =============================================================================
#  COUNTDOWN HEARTBEAT
# =============================================================================

[delayed_gcode _HEATSOAK_UPDATE]
gcode:
    UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        PRINT_START TICK=1
    {% endif %}


# =============================================================================
#  PRINT_START  --  main entry point, called by Orca as:
#    PRINT_START BED={bed_temperature} EXTRUDER={temperature}
#
#  Internal calls (do not use manually):
#    PRINT_START TICK=1        -- heartbeat tick
#    PRINT_START SKIP=1        -- user pressed Skip
#    PRINT_START CANCEL=1      -- user pressed Cancel
#    PRINT_START ADJUST=<+/->  -- user adjusted time (minutes)
# =============================================================================

[gcode_macro PRINT_START]
variable_state: {}
variable_heatsoak_active: 0

gcode:
    {% set SELF      = "PRINT_START" %}
    {% set IS_TICK   = params.TICK|default(0)|int %}
    {% set IS_SKIP   = params.SKIP|default(0)|int %}
    {% set IS_CANCEL = params.CANCEL|default(0)|int %}
    {% set IS_ADJUST = "ADJUST" in params %}
    {% set IS_INIT   = not IS_TICK and not IS_SKIP and not IS_CANCEL and not IS_ADJUST %}

    {% set cfg    = printer["gcode_macro _HEATSOAK_CFG"] %}
    {% set state  = printer["gcode_macro PRINT_START"].state %}
    {% set active = printer["gcode_macro PRINT_START"].heatsoak_active %}

    # ── Shared Jinja helpers ──────────────────────────────────────────────────

    {%- macro format_time(sec) -%}
        {%- set s  = sec|int(0) -%}
        {%- set h  = s // 3600 -%}
        {%- set m  = (s % 3600) // 60 -%}
        {%- set s2 = s % 60 -%}
        {%- set parts = [] -%}
        {%- if h -%}{%- set _ = parts.append(h ~ "h") -%}{%- endif -%}
        {%- if m -%}{%- set _ = parts.append(m ~ "m") -%}{%- endif -%}
        {%- set _ = parts.append(s2 ~ "s") -%}
        { parts[0:2]|join(" ") }
    {%- endmacro -%}

    # (?![a-zA-Z]) lookahead is required -- without it, filenames like
    # "3dbenchy...0.25mm...2h20m.gcode" misread "3d" as 3 days and "25m" out
    # of "0.25mm" as 25 minutes. See Heatsoak_Universal.cfg CHANGELOG.
    {%- macro get_duration_from_name(fname) -%}
        {%- set glob     = printer.printer.__class__.__init__.__globals__ -%}
        {%- set re       = glob.importlib.import_module("re") -%}
        {%- set unit_map = {"d": 86400, "h": 3600, "m": 60, "s": 1} -%}
        {%- set matches  = re.findall("([0-9]+)([dhms])(?![a-zA-Z])", fname|string) -%}
        {%- set durations = [] -%}
        {%- for num, unit in matches if unit in unit_map -%}
            {%- set _ = durations.append(num|float * unit_map[unit]) -%}
        {%- endfor -%}
        { durations|sum if durations else -1 }
    {%- endmacro -%}

    {%- macro ui(msg)  -%}{ action_respond_info("action:prompt_" ~ msg) }{%- endmacro -%}
    {%- macro add(msg) -%}{ ui(msg) }{ ui("show") }{%- endmacro -%}

    {%- macro show_ui(soak_left) -%}
        {% set ps = printer.print_stats %}
        { ui("begin Heatsoak (Ellie) -- " ~ (ps.filename.split("_")[0]|default("next print"))) }
        { ui("text Print file: " ~ (ps.filename|default("unknown")|string)) }
        {% set pdur = state.get("print_dur_sec", 0)|int %}
        {% if pdur > 0 %}
            { ui("text Print duration: " ~ format_time(pdur)) }
        {% else %}
            { ui("text Print duration: Unknown") }
        {% endif %}
        { ui("text Soak remaining: " ~ format_time(soak_left|int)) }
        { ui("text Bed target: " ~ (state.get("bed", 0)|int)|string ~ "C") }
        { ui("text Nozzle standby: " ~ (state.get("noz", 0)|int)|string ~ "C") }
        { ui("button_group_start") }
        {% for step in [15, 10, 5, -5, -10, -15] %}
            { ui("button " ~ ("+" ~ step|string if step > 0 else step|string) ~ " min|" ~ SELF ~ " ADJUST=" ~ step ~ "|accent--text text--" ~ ("lighten" if step > 0 else "darken") ~ "-3") }
        {% endfor %}
        { ui("button_group_end") }
        { ui("footer_button [ X ] Cancel|" ~ SELF ~ " CANCEL=1|error") }
        { add("footer_button [ > ] Skip|" ~ SELF ~ " SKIP=1|success") }
    {%- endmacro -%}

    {%- macro zero_soak_fans() -%}
        {% for fan_entry in cfg.soak_fans %}
            SET_FAN_SPEED FAN={fan_entry[0]} SPEED=0
        {% endfor %}
        M107
    {%- endmacro -%}

    {%- macro resume_and_start() -%}
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
        { ui("end") }
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        { zero_soak_fans() }
        {% if printer.pause_resume.is_paused %}
            RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
            SAVE_GCODE_STATE NAME=PAUSE_STATE
            RESUME_BASE
        {% endif %}
        {action_respond_info("Heatsoak complete -- calling PRINT_START_BASE")}
        # PRINT_START_BASE only reads BED/EXTRUDER (it errors on anything
        # else missing) -- forward just those two, not the generic slicer
        # field set.
        PRINT_START_BASE BED={state.get("bed", 60)|int} EXTRUDER={state.get("noz", 200)|int}
        {% set _ = state.clear() %}
    {%- endmacro -%}

    # =========================================================================
    #  ADJUST BRANCH
    # =========================================================================
    {% if IS_ADJUST %}
        {% if state and (state|string) != "{}" and active %}
            {% set delta   = params.ADJUST|float * 60.0 %}
            {% set newleft = [[state.get("soak_left", 0)|float + delta, 0]|max,
                               cfg.soak_max_seconds|float]|min %}
            {% set _ = state.update({"soak_left": newleft}) %}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"
            { show_ui(newleft|int) }
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0.2
        {% else %}
            {action_respond_info("Heatsoak ADJUST ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  SKIP BRANCH
    # =========================================================================
    {% elif IS_SKIP %}
        {% if state and (state|string) != "{}" and active %}
            {action_respond_info("Heatsoak SKIP: proceeding to print")}
            { resume_and_start() }
        {% else %}
            {action_respond_info("Heatsoak SKIP ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  CANCEL BRANCH
    # =========================================================================
    {% elif IS_CANCEL %}
        {% if state and (state|string) != "{}" and active %}
            {action_respond_info("Heatsoak CANCEL")}
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0
            { ui("end") }
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
            { zero_soak_fans() }
            RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
            CANCEL_PRINT
        {% else %}
            {action_respond_info("Heatsoak CANCEL ignored: no active soak")}
        {% endif %}

    # =========================================================================
    #  TICK BRANCH  --  heartbeat
    # =========================================================================
    {% elif IS_TICK %}
        {% if state and (state|string) != "{}" and active %}
            {% set soak_left = state.get("soak_left", 0)|float %}

            {% if soak_left <= 0 %}
                { resume_and_start() }
            {% else %}
                {% if soak_left > 300 %}
                    {% set interval = 60 %}
                {% elif soak_left > 60 %}
                    {% set interval = 30 %}
                {% elif soak_left > 10 %}
                    {% set interval = 10 %}
                {% else %}
                    {% set interval = 5 %}
                {% endif %}

                {% set newleft = [soak_left - interval, 0]|max %}
                {% set _ = state.update({"soak_left": newleft}) %}
                SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"
                { show_ui(newleft|int) }
                UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION={interval}
            {% endif %}
        {% endif %}

    # =========================================================================
    #  INIT BRANCH  --  called by Orca
    # =========================================================================
    {% elif IS_INIT %}

        {% set bed = params.BED|default(params.BED_TEMP|default(0))|float %}
        {% set noz = params.EXTRUDER|default(params.EXTRUDER_TEMP|default(params.TOOL_TEMP|default(200)))|float %}

        {action_respond_info("PRINT_START: bed=%sC  nozzle=%sC  file=%s" % (
            bed|string, noz|string,
            printer.print_stats.filename|default("unknown")))}

        # -- Parse print duration from filename -------------------------------
        {% set fname   = printer.print_stats.filename|default("")|string %}
        {% set dur_sec = get_duration_from_name(fname)|int %}
        {% set dur_min = (dur_sec / 60.0) if dur_sec >= 0 else cfg.soak_default_minutes|float %}

        # -- Should we soak? --------------------------------------------------
        {% set should_soak = (
            bed >= cfg.min_bed_temp_to_trigger|float
            and dur_min >= cfg.min_print_minutes_to_trigger|float
        ) %}

        {action_respond_info("Heatsoak decision: should_soak=%s  dur_min=%s" % (
            should_soak|string, dur_min|round(1)|string))}

        {% if not should_soak %}
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
            PRINT_START_BASE {rawparams}

        {% else %}
            {% set raw_soak = cfg.soak_sec_per_print_min|float * dur_min %}
            {% set soak_sec = [[raw_soak, cfg.soak_min_seconds|float]|max,
                                cfg.soak_max_seconds|float]|min %}

            {% set _ = state.update({
                "bed":           bed|float,
                "noz":           noz|float,
                "soak_left":     soak_sec|float,
                "print_dur_sec": dur_sec|int,
            }) %}

            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=1
            SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{state}"

            SAVE_GCODE_STATE NAME=HEATSOAK_STATE

            M140 S{bed}

            {% if printer.toolhead.homed_axes|lower != "xyz" %}
                G28
            {% endif %}

            # THIS IS WHAT ACTUALLY BLOCKS THE PRINT DURING THE SOAK.
            # PAUSE_BASE is Ellie's own bypass wrapper (printer.cfg) around
            # the mainsail-config-renamed BASE_PAUSE -- verified from source,
            # NOT assumed. A wrong name here fails as a silent "Unknown
            # command" and the soak runs with ZERO real protection while
            # looking normal.
            PAUSE_BASE

            # Show popup immediately, BEFORE machine starts moving
            { show_ui(soak_sec|int) }

            # Physical prep fires 0.1s later so popup renders first
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0.1
            UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=5
        {% endif %}

    {% endif %}

    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=state VALUE="{state}"


# =============================================================================
#  PRINT_START_BASE  --  Ellie-specific pre-print sequence
#  Runs after heatsoak completes (or immediately if no soak needed).
#  Unchanged from the prior working macro except for the idle-timeout
#  restore at the top (needed now because _HEATSOAK_PREP lowers idle_timeout
#  during the soak instead of the old macro's blanket 43200s).
# =============================================================================

[gcode_macro PRINT_START_BASE]
gcode:
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout|int}

  {% if 'BED' not in params or 'EXTRUDER' not in params %}
    RESPOND TYPE=error MSG="PRINT_START_BASE called without BED or EXTRUDER params — aborting"
    CANCEL_PRINT
  {% else %}
  {% set target_bed      = params['BED']|int %}
  {% set target_extruder = params['EXTRUDER']|int %}

  BED_MESH_CLEAR

  SET_DISPLAY_TEXT MSG="Heating bed to {target_bed}C"
  RESPOND MSG="Heating: bed->{target_bed}C, nozzle standby->150C"
  M140 S{target_bed}
  M109 S150

  M190 S{target_bed}

  SET_DISPLAY_TEXT MSG="Homing"
  RESPOND MSG="Homing all axes"
  G28
  G90

  SET_DISPLAY_TEXT MSG="Cleaning nozzle"
  RESPOND MSG="Cleaning nozzle"
  KOMB

  SET_DISPLAY_TEXT MSG="Cooling nozzle to 150C for touch"
  RESPOND MSG="Cooling nozzle to 150C before touch home"
  M109 S150
  G4 P10000

  CARTOGRAPHER_TOUCH_HOME

  SET_DISPLAY_TEXT MSG="Bed mesh"
  RESPOND MSG="Adaptive bed mesh scan"
  BED_MESH_CALIBRATE ADAPTIVE=1
  SMART_PARK

  SET_DISPLAY_TEXT MSG="Heating hotend to {target_extruder}C"
  RESPOND MSG="Heating hotend to {target_extruder}C"
  M107
  M109 S{target_extruder}

  LINE_PURGE
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  RESPOND MSG="Print starting!"
  {% endif %}


# =============================================================================
#  CANCEL_PRINT WRAPPER -- catches cancellation from ANY source
# =============================================================================
#  Ellie's prior macro had no equivalent of this: an external cancel
#  (Mainsail's UI button, a raw API call -- anything other than this macro's
#  own popup Cancel button) bypassed the heatsoak logic entirely, leaving its
#  recurring _HEATSOAK_UPDATE timer (and any pending _HEATSOAK_PREP) running
#  unaware the print was cancelled. This wrapper tears down heatsoak state
#  first, then falls through to whatever CANCEL_PRINT already resolved to
#  (mainsail-config's chain).
# =============================================================================

[gcode_macro CANCEL_PRINT]
rename_existing: HEATSOAK_TRUE_CANCEL_PRINT
description: Cancel print -- also tears down any active heatsoak first
gcode:
    {% set st = printer["gcode_macro PRINT_START"] %}
    {% if st.state and (st.state|string) != "{}" and st.heatsoak_active %}
        {action_respond_info("Heatsoak: tearing down for external CANCEL_PRINT")}
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_PREP DURATION=0
        RESPOND TYPE=command MSG="action:prompt_end"
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        M106 S0
        M107
        RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=state VALUE="{{}}"
    {% endif %}
    HEATSOAK_TRUE_CANCEL_PRINT
