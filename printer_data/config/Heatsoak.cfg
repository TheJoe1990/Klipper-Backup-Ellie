[gcode_macro PRINT_START_BASE]
gcode:
  # Description: Ellie’s real print start (called after optional heatsoak)

  # --- Debug: show exactly what this macro received ---
  {action_respond_info("PRINT_START_BASE rawparams: " ~ rawparams|string)}
  {action_respond_info("PRINT_START_BASE parsed -> BED=" ~ (params.BED|default("MISSING")) ~ "  EXTRUDER=" ~ (params.EXTRUDER|default("MISSING")) ~ "  CHAMBER=" ~ (params.CHAMBER|default("not set")))}

  {% set target_bed      = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber  = params.CHAMBER|default("40")|int %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  BED_MESH_CLEAR

  SET_DISPLAY_TEXT MSG="Heating"
  {action_respond_info("Heating: bed->" ~ target_bed|string ~ "C, nozzle standby->150C")}
  M140 S{target_bed}
  M109 S150

  M190 S{target_bed}

  # STATUS_HOMING (removed: not a macro)
  SET_DISPLAY_TEXT MSG="Homing"
  {action_respond_info("Homing...")}
  G28
  G90

  # STATUS_MESHING (removed: not a macro)
  SET_DISPLAY_TEXT MSG="Bed mesh"
  {action_respond_info("Bed mesh calibrate (rapid_scan) ...")}
  BED_MESH_CALIBRATE METHOD=scan
  SMART_PARK

  # STATUS_HEATING (removed: not a macro)
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  {action_respond_info("Heating hotend to " ~ target_extruder|string ~ "C")}
  M107
  M109 S{target_extruder}

  LINE_PURGE
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  {action_respond_info("PRINT_START_BASE complete")}



[gcode_macro HEATSOAK]
gcode:
    # ------------------------------------------------------------------
    # PLAIN ENGLISH EXPLAINER
    # Heatsoak helper (NO TIMER):
    # 1) Start heating bed to BED (wait)
    # 2) Home if needed
    # 3) Heat nozzle to NOZZLE_TEMP (default 150) (wait)
    # 4) Park Z up and move to center (only if homed)
    # ------------------------------------------------------------------
    {% set bed   = params.BED|default(params.BED_TEMP|default(60))|float %}
    {% set noz   = params.NOZZLE_TEMP|default(params.NOZZLE|default(150))|float %}
    {% set parkz = params.PARK_Z|default(5)|float %}

    {action_respond_info("HEATSOAK start -> bed=" ~ bed|string ~ "C, nozzle=" ~ noz|string ~ "C")}

    M140 S{bed}

    {% if printer.toolhead.homed_axes|lower != "xyz" %}
      G28
    {% endif %}

    M190 S{bed}

    {% if noz|float > 0 %}
      M109 S{noz}
    {% endif %}

    {% if printer.toolhead.homed_axes|lower == "xyz" %}
      G90
      G1 Z{parkz} F1800
      G1 X{(printer.toolhead.axis_maximum.x|float)/2.0} Y{(printer.toolhead.axis_maximum.y|float)/2.0} F6000
    {% else %}
      {action_respond_info("HEATSOAK: not homed; skipping park moves")}
    {% endif %}



[delayed_gcode _HEATSOAK_UPDATE]
gcode:
    # Description: Heartbeat for the popup countdown
    UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
    {% set st = printer["gcode_macro PRINT_START"].state %}
    {% if st and (st|string) != "{}" %}
      PRINT_START TICK=1
    {% endif %}


[gcode_macro PRINT_START]
# IMPORTANT: variable dict MUST be ONE LINE (Klipper config limitation)
variable_soak_settings: {'enabled': True, 'min_temp_to_trigger': 65, 'min_duration_to_trigger': 30, 'soak_seconds_per_minute': 5, 'soak_time': {'min': 5, 'max': 45}}
variable_state: {}
variable_heatsoak_active: 0
gcode:
    # ------------------------------------------------------------------
    # PLAIN ENGLISH EXPLAINER (for future-you)
    # - Orca calls: PRINT_START BED=.. EXTRUDER=..
    # - If the job is "big enough" and bed temp is "hot enough", we:
    #     1) Mark heatsoak_active=1 (so PAUSE/RESUME do minimal behavior)
    #     2) Pause and show popup
    #     3) Run HEATSOAK once (heat + home + park)
    #     4) Countdown using delayed_gcode heartbeat
    #     5) Clear heatsoak_active and run PRINT_START_BASE exactly once
    # - If no soak needed, call PRINT_START_BASE immediately.
    # ------------------------------------------------------------------

    {action_respond_info("PRINT_START rawparams from slicer: " ~ rawparams|string)}
    {action_respond_info("PRINT_START params dict: " ~ (params|string))}

    {% set SELF = "PRINT_START" %}
    {% set SS   = soak_settings %}
    {% set ps   = printer.print_stats %}

    {%- macro ui(msg)  -%}{ action_respond_info("action:prompt_" ~ msg) }{%- endmacro -%}
    {%- macro add(msg) -%}{ ui(msg) }{ ui("show") }{%- endmacro -%}

    {%- macro clamp_seconds(sec) -%}
      { [ [ SS.soak_time.min * 60.0, sec|float ]|max, SS.soak_time.max * 60.0 ]|min }
    {%- endmacro -%}

    {%- macro get_duration_from_name(name) -%}
      {%- set glob = printer.printer.__class__.__init__.__globals__ -%}
      {%- set re = glob.importlib.import_module("re") -%}
      {%- set unit_map = {"d":86400,"h":3600,"m":60,"s":1} -%}
      {%- set matches = re.findall("([0-9]+)([dhms])", name|string|lower) -%}
      {%- set durations = [] -%}
      {%- for num, unit in matches if unit in unit_map -%}
        {%- set _ = durations.append(num|float * unit_map[unit]) -%}
      {%- endfor -%}
      { durations|sum if durations else -1 }
    {%- endmacro -%}

    {%- macro format_time(sec) -%}
      {%- set t = sec|int(0) -%}
      {%- set h = (t // 3600) -%}
      {%- set m = (t % 3600) // 60 -%}
      {%- set s = t % 60 -%}
      {%- if h > 0 -%}
        { h ~ "h " ~ m ~ "m" }
      {%- else -%}
        { m ~ "m " ~ s ~ "s" }
      {%- endif -%}
    {%- endmacro -%}

    {%- macro show_ui(soak_left) -%}
      { ui("begin heat soak (Ellie)") }
      { ui("text File: " ~ (ps.filename|default("unknown")|string)) }
      { ui("text Soak remaining: " ~ format_time(soak_left|int)) }
      { ui("text Bed target: " ~ (state.get("bed",0)|int)|string ~ "C") }
      { ui("text Nozzle standby: " ~ (state.get("noz",0)|int)|string ~ "C") }

      { ui("button_group_start") }
      {% for step in [15, 10, 5, -5, -10, -15] %}
        { ui("button " ~ (("+" ~ step|string) if step>0 else step|string) ~ " min|" ~ SELF ~ " ADJUST=" ~ step ~ "|accent--text text--lighten-3") }
      {% endfor %}
      { ui("button_group_end") }

      { ui("button_group_start") }
      { ui("button [ ⏹ ] Cancel|" ~ SELF ~ " CANCEL=1|error") }
      { add("button [ ▶ ] Skip|" ~ SELF ~ " SKIP=1|success") }
      { add("button_group_end") }
    {%- endmacro -%}

    {%- macro stop_heartbeat() -%}
      UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0
    {%- endmacro -%}

    {%- macro clear_heatsoak_flag() -%}
      SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
    {%- endmacro -%}

    {%- macro resume_and_start() -%}
      { stop_heartbeat() }
      { ui("end") }

      # Heatsoak is done (or skipped): allow normal PAUSE/RESUME behavior again
      { clear_heatsoak_flag() }

      {% if printer.pause_resume.is_paused %}
        # We paused using PAUSE_BASE. Resume without triggering your custom RESUME logic.
        RESTORE_GCODE_STATE NAME=HEATSOAK_STATE MOVE=0
        RESUME_BASE
      {% endif %}

      {action_respond_info("Heatsoak complete -> calling PRINT_START_BASE once")}
      PRINT_START_BASE { state.get("rawparams","") }

      {% set _ = state.clear() %}
    {%- endmacro -%}

    {%- macro tick() -%}
      {% set now  = ps.total_duration|float %}
      {% set last = state.get("last_total", now)|float %}
      {% set left = state.get("soak_left", 0.0)|float %}

      {% set remain = left - (now - last) %}
      {% set _ = state.update({"soak_left": remain, "last_total": now}) %}

      {% if remain|int <= 0 %}
        { resume_and_start() }
      {% else %}
        {% set s = remain|int %}
        {% if s > 300 %}
          {% set interval = 300 %}
        {% elif s > 60 %}
          {% set interval = 60 %}
        {% else %}
          {% set interval = 10 %}
        {% endif %}

        { show_ui(s) }
        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION={interval}
      {% endif %}
    {%- endmacro -%}

    # ---------------------------
    # Button actions
    # ---------------------------
    {% if "CANCEL" in params %}
      {action_respond_info("Heatsoak popup: CANCEL")}
      { stop_heartbeat() }
      { ui("end") }
      { clear_heatsoak_flag() }
      {% set _ = state.clear() %}
      CANCEL_PRINT

    {% elif "SKIP" in params %}
      {action_respond_info("Heatsoak popup: SKIP")}
      {% set _ = state.update({"soak_left": 0.0}) %}
      { resume_and_start() }

    {% elif "ADJUST" in params %}
      {% set add_sec  = (params.ADJUST|float * 60.0) %}
      {% set new_left = clamp_seconds(state.get("soak_left",0.0)|float + add_sec)|float %}
      {% set _ = state.update({"soak_left": new_left, "last_total": ps.total_duration|float}) %}
      { show_ui(new_left|int) }
      UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0.2

    {% elif "TICK" in params %}
      {% if state and (state|string) != "{}" %}
        { tick() }
      {% endif %}

    {% else %}
      # ---------------------------
      # First entry (called by Orca)
      # ---------------------------
      {% set bed   = params.BED|default(params.BED_TEMP|default(0))|int %}
      {% set noz   = params.EXTRUDER|default(params.EXTRUDER_TEMP|default(params.TOOL_TEMP|default(0)))|int %}
      {% set fname = ps.filename|default("")|string %}
      {% set dur_sec = get_duration_from_name(fname)|int %}
      {% set dur_min = (dur_sec / 60.0) if dur_sec >= 0 else -1 %}

      {% if bed > 0 %} M140 S{bed} {% endif %}

      {% set should_soak = (SS.enabled and bed >= SS.min_temp_to_trigger and dur_min >= SS.min_duration_to_trigger) %}
      {action_respond_info("Heatsoak decision -> should_soak=" ~ should_soak|string ~ " (bed=" ~ bed|string ~ "C, duration_min=" ~ dur_min|string ~ ")")}

      {% if not should_soak %}
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=0
        PRINT_START_BASE {rawparams}
      {% else %}
        {% set soak_sec = clamp_seconds(SS.soak_seconds_per_minute * dur_min)|float %}

        {% set _ = state.update({
          "rawparams": rawparams|string,
          "bed": bed|float,
          "noz": noz|float,
          "soak_left": soak_sec|float,
          "last_total": ps.total_duration|float
        }) %}

        # Tell PAUSE/RESUME this is "heatsoak pause", not a real user pause
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=heatsoak_active VALUE=1

        SAVE_GCODE_STATE NAME=HEATSOAK_STATE
        PAUSE_BASE

        { show_ui(soak_sec|int) }

        # Run the actual heat/home/park routine once
        HEATSOAK BED={bed} NOZZLE_TEMP=150
        {% set _ = state.update({"last_total": ps.total_duration|float}) %}

        UPDATE_DELAYED_GCODE ID=_HEATSOAK_UPDATE DURATION=0.2
      {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO={SELF} VARIABLE=state VALUE="{state}"
