# =============================================================================
# Cartographer USB Probe (Survey Mode) — A4T Printhead / XOL Carriage
# Uses scanner.py (survey/scan mode), NOT cartographer.py (touch mode)
# Probe firmware: Cartographer HT 5.1.0
# =============================================================================
#
# AFTER INSTALL — CALIBRATION STEPS:
# 1. Home X and Y:         G28 X Y
# 2. Run scan calibration: CARTOGRAPHER_CALIBRATE
# 3. Verify/adjust y_offset: 21.1 (community estimate — nozzle to coil distance)
# =============================================================================

[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_5B0067000850525537333120-if00
restart_method: command

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 100

[scanner]
mcu: cartographer
sensor: cartographer
# x_offset: 0 is standard for XOL mounts
# y_offset: 21.1 is a community estimate for A4T/XOL — calibrate after install
# Previous Eddy NG values: x_offset: 0, y_offset: 26.0
x_offset: 0
y_offset: 21.1
backlash_comp: 0.5
trigger_distance: 2.
trigger_dive_threshold: 1.5
trigger_hysteresis: 0.006
cal_nozzle_z: 0.1
cal_floor: 0.2
cal_ceil: 5.
cal_speed: 1.0
cal_move_speed: 10.
default_model_name: default
mesh_runs: 2
mode: scan

[bed_mesh]
zero_reference_position: 150, 150
speed: 200
# mesh_min Y=31: probe at Y=31 puts nozzle at Y~10 (y_offset 21.1)
mesh_min: 10, 31
mesh_max: 290, 270
probe_count: 30, 30
algorithm: bicubic

[safe_z_home]
home_xy_position: 150, 150
z_hop: 10
z_hop_speed: 25
speed: 200

