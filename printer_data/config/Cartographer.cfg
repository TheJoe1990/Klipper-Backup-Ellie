# =============================================================================
# Cartographer USB Probe — A4T Printhead / XOL Carriage
# =============================================================================
#
# SWAP DAY CHECKLIST:
# 1. Unplug Eddy, plug in Cartographer USB
# 2. Run: ls /dev/serial/by-id/   — find the usb-Cartographer_... entry
# 3. Update serial: below with that value
# 4. In printer.cfg:
#      - Comment out:  [include Eddy_ng.cfg]
#      - Uncomment:    [include Cartographer.cfg]
#      - Change stepper_z endstop_pin to: cartographer:z_virtual_endstop
# 5. In Heatsoak.cfg PRINT_START_BASE:
#      - Change: BED_MESH_CALIBRATE METHOD=rapid_scan
#      - To:     BED_MESH_CALIBRATE METHOD=scan
# 6. Restart Klipper
# 7. Run CARTOGRAPHER_CALIBRATE to build the probe model
# 8. Verify/adjust y_offset: 21.1 (community estimate — measure nozzle-to-coil distance)
# 9. Uncomment [adxl345] and [resonance_tester] sections below
# =============================================================================

[mcu cartographer]
# Find with: ls /dev/serial/by-id/
serial: /dev/serial/by-id/usb-Cartographer_cartographer_CHANGE_ME-if00
restart_method: command

[temperature_sensor cartographer_mcu]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 0
max_temp: 100

[cartographer]
mcu: cartographer
speed: 40.
lift_speed: 5.
backlash_comp: 0.5
# x_offset: 0 is standard for most XOL mounts
# y_offset: 21.1 is a community estimate for A4T/XOL — calibrate after install
# Previous Eddy NG values were: x_offset: 0, y_offset: 26.0
x_offset: 0
y_offset: 21.1
trigger_distance: 2.
trigger_dive_threshold: 1.5
trigger_hysteresis: 0.006
cal_nozzle_z: 0.1
cal_floor: 0.2
cal_ceil: 5.
cal_speed: 1.0
cal_move_speed: 10.
default_model_name: default
mesh_runs: 2

[bed_mesh]
zero_reference_position: 150, 150
speed: 200
# mesh_min Y=31: probe at Y=31 puts nozzle at Y~10 (y_offset 21.1)
mesh_min: 10, 31
mesh_max: 290, 270
probe_count: 30, 30
algorithm: bicubic

[safe_z_home]
home_xy_position: 150, 150
z_hop: 10
z_hop_speed: 25
speed: 200

# Uncomment after Cartographer is physically installed and Klipper is running
# [adxl345]
# cs_pin: cartographer:PA3
# spi_bus: spi1

# [resonance_tester]
# accel_chip: adxl345
# probe_points:
#     150, 150, 20
