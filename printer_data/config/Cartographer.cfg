# Cartographer USB Probe Configuration
# Printhead: A4T with XOL Carriage
#
# NOTE: x_offset and y_offset are community estimates for A4T/XOL.
# Verify and calibrate with PROBE_CALIBRATE after installation.
# Eddy NG reference values were: x_offset: 0, y_offset: 26.0

[mcu cartographer]
# Serial will be populated once the probe is physically connected.
# Run: ls /dev/serial/by-id/ to find the correct value.
serial: /dev/serial/by-id/usb-Cartographer_cartographer_CHANGE_ME-if00
restart_method: command

[cartographer]
mcu: cartographer
speed: 40.
lift_speed: 5.
backlash_comp: 0.5
# Offsets: community estimate for A4T/XOL — measure and calibrate after install
x_offset: 0
y_offset: 21.1
trigger_distance: 2.
trigger_dive_threshold: 1.5
trigger_hysteresis: 0.006
cal_nozzle_z: 0.1
cal_floor: 0.2
cal_ceil: 5.
cal_speed: 1.0
cal_move_speed: 10.
default_model_name: default
mesh_runs: 2

[bed_mesh]
zero_reference_position: 150, 150
speed: 200
mesh_min: 10, 31
mesh_max: 290, 270
probe_count: 30, 30
algorithm: bicubic

[safe_z_home]
home_xy_position: 150, 150
z_hop: 10
z_hop_speed: 25
speed: 200

