# ======================================================================
# MCU / electronics cooling fan
# Turns on automatically when steppers or heaters are active
# ======================================================================

[controller_fan mcu_fan]
pin: PA0
idle_timeout: 30

[thermistor bed_100k_beta_4138]
temperature1: 25
resistance1: 100000
beta: 4138

[heater_bed]
heater_pin: !PA19
sensor_type: bed_100k_beta_4138
pullup_resistor: 4700
#TDK NTCG104LH104JT1 #or # NTC 100K MGB18-104F39050L32 #PT1000 #likely not EPCOS 100K B57560G104F
sensor_pin: PC13
#control: watermark
min_temp: 0
max_temp: 110

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor duet_mcu]
sensor_type: temperature_mcu

[mcu]
serial: /dev/serial/by-id/usb-Klipper_sam4e8e_00313753314E33383038303536303331-if00



[printer]
kinematics: corexy

