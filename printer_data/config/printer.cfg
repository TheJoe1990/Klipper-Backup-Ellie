[gcode_arcs]

# This file is an example config file for cartesian style printers.
# One may copy and edit this file to configure a new cartesian
# printer.

# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT
# FIRST. Incorrectly configured parameters may cause damage.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include timelapse.cfg]
[exclude_object]
[include KAMP_Settings.cfg]
[include ShakeTune.cfg]
[include SpeedTuning.cfg]
[include NiteHawk36.cfg]
# [include Eddy_ng.cfg]  # Replaced by Cartographer - tag: pre-cartographer-migration
[include Cartographer.cfg]
[include Heatsoak.cfg]
[include Orbiter_Smart_Sensor.cfg]
[idle_timeout]
#gcode:
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 43200
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 73.0

shaper_type_y: mzv
shaper_freq_y: 65.8


[force_move]
enable_force_move: true

[stepper_y]
step_pin: PD6
dir_pin: PD11
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC14
position_endstop: 328
position_max: 328
position_min: -17
homing_speed: 25
second_homing_speed: 8


[tmc2660 stepper_y]
cs_pin: PD14
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[stepper_x]
step_pin: PD7
dir_pin: PD12
enable_pin: !PC6
microsteps: 16
rotation_distance: 40
#endstop_pin: ^!PC14 #^!PA2 This is one of the other endstop pins but not used for Y now.  
position_min: -15
position_endstop: 338
position_max: 338
homing_speed: 25
second_homing_speed: 8


[tmc2660 stepper_x]
cs_pin: PC9
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

[stepper_z]
step_pin: PD8
dir_pin: !PD13
enable_pin: !PC6
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
#endstop_pin: ^PD29
#endstop_pin: PD10  # E0 endstop
#endstop_pin: PC16  # E1 endstop
#position_endstop: 0.5
position_min: -10
position_max: 400

[tmc2660 stepper_z]
cs_pin: PC10
spi_bus: usart1
run_current: 1.000
sense_resistor: 0.051

#[bltouch]
#sensor_pin: ^PC1
#control_pin: PC3
#z_offset:0
#x_offset: -28
#y_offset: -15
#stow_on_each_sample: false
#adaptive_margin: 5
#samples:3

[screws_tilt_adjust]
screw1: 297, 281 #305, 310
screw1_name: rear right screw
screw2: 186, 281 #215, 310
screw2_name: mid rear screw
screw3: 10, 281 #29, 310
screw3_name: rear left screw
screw4: 10, 134
screw4_name: mid left screw
screw5: 10, -14
screw5_name: front left screw
screw6: 187, -14
screw6_name: front mid screw
screw7: 297, -14
screw7_name: front right screw
screw8: 297, 134
screw8_name: mid right screw
screw_thread: CCW-M3
horizontal_move_z: 10


