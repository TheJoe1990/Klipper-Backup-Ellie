[printer]
max_velocity: 400
max_accel: 20000         
square_corner_velocity: 30.0 
max_z_velocity: 25
max_z_accel: 30

#####################################################################
# ACTIVE — Fixed (no max()), deterministic MANUAL clamping
#####################################################################
[gcode_macro TEST_Z_SPEED]
description: Z stress test. MANUAL clamps velocity/accel; AUTO uses klipper_auto_speed output.
gcode:
    {% set speed      = params.SPEED|default(printer.configfile.settings.printer.max_z_velocity)|float %}
    {% set accel      = params.ACCEL|default(printer.configfile.settings.printer.max_z_accel)|float %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set bound      = params.BOUND|default(40)|float %}
    {% set test_dir   = params.TEST_DIRECTION|default("up")|lower %}
    {% set settle_ms  = params.SETTLE_MS|default(250)|int %}
    {% set mode       = params.MODE|default("MANUAL")|upper %}

    # AUTO mode knobs
    {% set max_missed = params.MAX_MISSED|default(1.0)|float %}
    {% set derate     = params.DERATE|default(0.99)|float %}
    {% set accel_step = params.ACCEL_STEP|default(1.0)|float %}
    {% set vel_step   = params.VEL_STEP|default(1.0)|float %}
    {% set accu       = params.ACCU|default(0.1)|float %}

    {% set z_min = printer.toolhead.axis_minimum.z + bound %}
    {% set z_max = printer.toolhead.axis_maximum.z - bound %}

    # A safe "slow" value without using max()
    {% set speed_slow = speed / 2.0 %}
    {% if speed_slow < 1.0 %}
        {% set speed_slow = 1.0 %}
    {% endif %}
    {% set accel_slow = accel / 2.0 %}
    {% if accel_slow < 1.0 %}
        {% set accel_slow = 1.0 %}
    {% endif %}

    SAVE_GCODE_STATE NAME=TEST_Z_SPEED
    G90
    M400

    # --- Home Z (or all if nothing is homed yet) ---
    {% if printer.toolhead.homed_axes|default("") == "" %}
        M118 TEST_Z_SPEED: Not homed -> G28 (all)
        G28
    {% elif 'z' not in printer.toolhead.homed_axes|lower %}
        M118 TEST_Z_SPEED: Z not homed -> G28 Z
        G28 Z
    {% else %}
        M118 TEST_Z_SPEED: Establishing baseline -> G28 Z
        G28 Z
    {% endif %}

    M400
    G4 P{settle_ms}

    {% if mode == "MANUAL" %}
        #################################################################
        # MODE=MANUAL
        # Clamp planner limits ONCE, so the test always respects SPEED/ACCEL
        # (no reliance on whatever limits were set before the macro ran).
        #################################################################
        M118 TEST_Z_SPEED: MODE=MANUAL clamping VELOCITY={speed} ACCEL={accel}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel}

        # Move into test range at the requested speed
        G1 Z{z_min} F{speed * 60.0}
        M400
        G4 P{settle_ms}

        M118 TEST_Z_SPEED: BASELINE (compare ONLY "mcu: stepper_z*" lines)
        GET_POSITION

        {% for i in range(iterations) %}
            M118 TEST_Z_SPEED: ITER {i+1}/{iterations} speed={speed} accel={accel} dir={test_dir} z_min={z_min} z_max={z_max}

            {% if test_dir == "up" %}
                # Fast up, slow down (still clamped globally, but feedrate differs)
                G1 Z{z_max} F{speed * 60.0}
                G1 Z{z_min} F{speed_slow * 60.0}
            {% else %}
                # Slow up, fast down
                G1 Z{z_max} F{speed_slow * 60.0}
                G1 Z{z_min} F{speed * 60.0}
            {% endif %}

            M400
            G4 P{settle_ms}

            # Re-home to establish a physical reference for step-count comparison
            G1 Z3 F{speed * 60.0}
            M400
            G4 P{settle_ms}

            G28 Z
            M400
            G4 P{settle_ms}

            M118 TEST_Z_SPEED: SNAPSHOT ITER {i+1}/{iterations} (after G28 Z)
            GET_POSITION
        {% endfor %}

    {% else %}
        #################################################################
        # MODE=AUTO
        # auto_speed constraints we’ve discovered:
        # - DERATE must be < 1.0
        # - MAX must be > MIN
        # - *_ACCU must be < 1.0
        #################################################################
        {% set a_min = accel %}
        {% set a_max = accel + accel_step %}
        {% set v_min = speed %}
        {% set v_max = speed + vel_step %}

        M118 TEST_Z_SPEED: MODE=AUTO using AUTO_SPEED (AXIS=z)
        M118 TEST_Z_SPEED: Requested v={speed} a={accel} | Using range v={v_min}-{v_max} a={a_min}-{a_max}
        M118 TEST_Z_SPEED: MAX_MISSED={max_missed} DERATE={derate} ACCU={accu}

        {% for i in range(iterations) %}
            M118 TEST_Z_SPEED: AUTO RUN {i+1}/{iterations} (watch AUTO_SPEED output for missed-step summary)
            AUTO_SPEED AXIS=z ACCEL_MIN={a_min} ACCEL_MAX={a_max} ACCEL_ACCU={accu} VELOCITY_MIN={v_min} VELOCITY_MAX={v_max} VELOCITY_ACCU={accu} DERATE={derate} MAX_MISSED={max_missed} LEVEL=0 VARIANCE=0
            M400
            G4 P{settle_ms}
        {% endfor %}

        M118 TEST_Z_SPEED: MODE=AUTO complete. See AUTO_SPEED output above for missed-steps summary.
    {% endif %}

    # Restore global limits to config defaults
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    RESTORE_GCODE_STATE NAME=TEST_Z_SPEED
    M118 TEST_Z_SPEED: Done.



[gcode_macro AUTO_SPEED_VALIDATE_FULL]
description: Validate using UI params; homes first; blanks = machine/[auto_speed] defaults
gcode:
    {% set AS = printer.configfile.settings.auto_speed %}
    # Defaults if a field is left blank in the UI:
    {% set ACCEL = (params.ACCEL|default(printer.toolhead.max_accel))|float %}
    {% set VELOCITY = (params.VELOCITY|default(printer.toolhead.max_velocity))|float %}
    {% set SCV = (params.SCV|default(printer.toolhead.square_corner_velocity))|float %}
    {% set MAX_MISSED = (params.MAX_MISSED|default(AS.max_missed|default(1.0)))|float %}
    {% set VALIDATE_MARGIN = (params.VALIDATE_MARGIN|default(AS.validate_margin|default(AS.margin|default(20.0))))|float %}
    {% set VALIDATE_INNER_MARGIN = (params.VALIDATE_INNER_MARGIN|default(AS.validate_inner_margin|default(1.0)))|float %}
    {% set VALIDATE_ITERATIONS = (params.VALIDATE_ITERATIONS|default(AS.validate_iterations|default(5)))|int %}

    G28
    AUTO_SPEED_VALIDATE ACCEL={ACCEL} VELOCITY={VELOCITY} SCV={SCV} MAX_MISSED={MAX_MISSED} VALIDATE_MARGIN={VALIDATE_MARGIN} VALIDATE_INNER_MARGIN={VALIDATE_INNER_MARGIN} VALIDATE_ITERATIONS={VALIDATE_ITERATIONS}

[auto_speed]
#axis: diag_x, diag_y  ; One or multiple of `x`, `y`, `diag_x`, `diag_y`, `z`

#margin: 20            ; How far away from your axes to perform movements

#settling_home: 1      ; Perform settling home before starting Auto Speed
#max_missed: 1.0       ; Maximum full steps that can be missed
#endstop_samples: 3    ; How many endstop samples to take for endstop variance

#accel_min: 1000.0     ; Minimum acceleration test may try
#accel_max: 50000.0    ; Maximum acceleration test may try
#accel_accu: 0.05      ; Keep binary searching until the result is within this percentage

#velocity_min: 50.0    ; Minimum velocity test may try
#velocity_max: 5000.0  ; Maximum velocity test may try
#velocity_accu: 0.05   ; Keep binary searching until the result is within this percentage

#derate: 0.8           ; Derate discovered results by this amount

#validate_margin: Unset      ; Margin for VALIDATE, Defaults to margin
#validate_inner_margin: 20.0 ; Margin for VALIDATE inner pattern
#validate_iterations: 50     ; Perform VALIDATE pattern this many times

#results_dir: ~/printer_data/config ; Destination directory for graphs