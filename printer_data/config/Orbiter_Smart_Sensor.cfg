[respond]
default_type: echo

[force_move]
enable_force_move: True

[gcode_macro runout_init]
gcode:
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}  
  {% if(sensor.disable_runout|lower == 'false') %}
      filament_change_state1
  {% else %}
    M118 O2S: Filament runout is disabled in the sensor config file! 
  {% endif %} 

[gcode_macro filament_change_state1]
variable_changebusy: 0
variable_temp_target: 0
gcode:
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}  
  {% if changebusy == 0 %}
    M118 O2S: Printer paused due to filament runout! 
    SET_DISPLAY_TEXT MSG="RUNOUT - Load new filament"
    PAUSE # call printer pause macro              
    {% if (sensor.disable_autochange|lower == 'false') %}
      SET_GCODE_VARIABLE MACRO=filament_change_state1 VARIABLE=changebusy VALUE=1       
      filament_change_state2
    {% endif %}  
  {% endif %}

[gcode_macro filament_change_state2]
gcode:
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}  
  SET_GCODE_VARIABLE MACRO=unload_tangle_init VARIABLE=loadbusy VALUE=1  
  {% if (sensor.enable_beep|lower == 'true') %} 
    M300 # beep sound
  {% endif %}
  M118 O2S: Unloading filament...   
  M83
  G92 E0   
  # {% if printer[printer.toolhead.extruder].temperature < 185 %} # hardcoded threshold
  {% if (printer.extruder.can_extrude|lower != 'true')%} # Checking for minimum extrusion temperature
        # Check if temperature is over the minimum extrusion temperature. min_extrude_temp must be defined in the extruder config (to about 185)
      M118 O2S: Heating hotend! 
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_unload_temp} # restore user temp if it was set before loading      
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={sensor.filament_unload_temp-1} #wait for reaching filament unload temperature
  {% endif %}     
  {% if(printer.extruder.target == 0) %} # Checking for set temperature if is zero, than heat hotend
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_unload_temp} # restore user temp if it was set before loading      
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={sensor.filament_unload_temp-1} #wait for reaching filament unload temperature
  {% endif %} 
  G0 E-5 F3600 	#extract filament to cold end
  G4 P2000 # wait for two seconds
  G0 E5 F3600 # push the filament back 
  G0 E-5 F3600 	#extract filament to cold end
  G0 E-{sensor.unload_distance} F300	# continue extraction slow allow filament to be cooled enough before reaches the gears  
  M400   
  M118 O2S: Load new filament! Wait until it is loaded, then resume printing.
  SET_DISPLAY_TEXT MSG="Load filament then RESUME"
  #SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0 # switch off heater
  UPDATE_DELAYED_GCODE ID=clear_loadbusy DURATION=0.5
  UPDATE_DELAYED_GCODE ID=clear_changebusy DURATION=0.5

[gcode_macro filament_load_init]
gcode:
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
  {% if (printer.print_stats.state != "printing") %}
    {% if(sensor.disable_autoload|lower == 'false') %}
      SET_GCODE_VARIABLE MACRO=unload_tangle_init VARIABLE=loadbusy VALUE=1
      filament_load
    {% else %}
    M118 O2S: Filament auto-load is disabled in the sensor config file! 
    {% endif %} 
  {% else %}    
    M118 O2S: Printing! Can't load filament right now! 
  {% endif %} 
  

[gcode_macro filament_load]
variable_USER_TEMP: 0
variable_LOAD_TEMP: 0
gcode:
    # ======================================================================
    # PLAIN ENGLISH (Ellie):
    # - If hotend isn't hot enough, heat to filament_load_temp so we can extrude.
    # - Force-feed filament a bit into the gears, then purge a configured amount.
    # - Restore temps:
    #     * printing/paused -> restore previous USER_TEMP (original behavior)
    #     * idle            -> keep hotend hot at load temp (Ellie change for Mom)
    # - NEW (minimal): add a small "anti-ooze retract" at the end of load.
    #     * If printing/paused, we record this retract so RESUME can pay it back
    #       right before motion resumes (prevents a brief starvation window).
    # ======================================================================

    {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
    {% set USER_TEMP = printer.extruder.target %}          # save user set temperature before loading
    {% set LOAD_TEMP = 0 %}

    M118 O2S: Loading filament...

    # Heat if needed (original behavior)
    {% if (printer.extruder.can_extrude|lower != 'true') or (printer.extruder.target < sensor.filament_load_min_temp) %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_load_temp}
      {% set LOAD_TEMP = sensor.filament_load_temp %}
      M118 O2S: Heating hotend!
    {% endif %}

    # Optional beep (disabled on Ellie currently, but kept for compatibility)
    {% if (sensor.enable_beep|lower == 'true') %}
      M300
    {% endif %}

    M82
    G92 E0
    G4 P1500

    # Push filament into gears (requires [force_move] enable_force_move: True)
    FORCE_MOVE STEPPER=extruder DISTANCE=15 VELOCITY=10 ACCEL=1000

    # Wait for temps that were requested
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={LOAD_TEMP-1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={USER_TEMP-1}

    # Purge to clear old filament
    G1 E{sensor.nozzle_purge_length} F{sensor.nozzle_purge_speed}
    M400

    # Restore/hold temperature at end of load
    {% if (printer.print_stats.state == "printing") or (printer.print_stats.state == "paused") %}
      # Printing/paused: restore the user's prior setpoint (original behavior)
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={USER_TEMP}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={USER_TEMP-1}
    {% else %}
      # Ellie change: DO NOT turn hotend off after load when idle (Mom confusion)
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_load_temp}
      # Original behavior (kept for easy revert):
      # SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}

    # ---- NEW (minimal): anti-ooze retract after load ----
    # Goal: reduce drool/ooze right after loading completes.
    # If we are paused/printing, store this value so RESUME can "pay it back"
    # immediately before printing resumes.
    {% set anti_ooze = 0.8 %}
    {% set minT = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    {% if printer.extruder.temperature >= minT %}
      G91
      G1 E-{anti_ooze} F1200
      G90
      {% if (printer.print_stats.state == "printing") or (printer.print_stats.state == "paused") %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=load_retract VALUE={anti_ooze}
      {% endif %}
    {% else %}
      {action_respond_info("FILAMENT_LOAD: skipping anti-ooze retract (nozzle below min_extrude_temp)")}
    {% endif %}

    # Status message (original)
    {% if printer["filament_switch_sensor O2_sensor"].filament_detected == true %}
      M118 O2S: Filament load complete!
      {% if (sensor.enable_beep|lower == 'true') %}
        M300
      {% endif %}
    {% else %}
      M118 O2S: Filament load failed!
    {% endif %}

    UPDATE_DELAYED_GCODE ID=clear_loadbusy DURATION=2

 

#############################################END filament auto load macro section END***********************************************************
#############################################filament auto unload and Tangle macro section *****************************************************************
[gcode_macro unload_tangle_init]
variable_loadbusy: 0
gcode:
  # ----------------------------------------------------------------------------------
  # PLAIN ENGLISH / WHY THIS EXISTS:
  # This macro is the "router" for the physical unload button:
  # - If printing: treat as filament tangle logic.
  # - If NOT printing: run a manual unload (filament_unload), but historically only
  #   when loadbusy==0 to avoid overlapping load/unload sequences.
  #
  # WHY WE CHANGED IT (minimal change):
  # When the printer is PAUSED due to runout, the O2S state machine may leave
  # loadbusy=1 (intentionally set during runout), or it may remain stuck if a step
  # was interrupted. That caused the unload button to appear "dead" while paused.
  #
  # New behavior (minimal, targeted):
  # - While PAUSED: always allow filament_unload (ignores loadbusy guard).
  #   This makes the unload button usable during runout intervention.
  # - While IDLE/READY (not printing, not paused): keep the original loadbusy guard.
  # ----------------------------------------------------------------------------------
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}

  {% if (printer.print_stats.state == "printing") %}
    # Filament tangle detection during printing (original behavior)
    {% if(sensor.disable_tangle|lower == 'false') %}
      filament_tangle
    {% else %}
      M118 O2S: Filament tangle detected, action disabled!
    {% endif %}

  {% else %}
    # Not printing -> this is a manual unload button press.
    {% if (sensor.disable_autounload|lower == 'false') %}

      {% if (printer.print_stats.state == "paused") %}
        # MINIMAL CHANGE:
        # If paused (often due to runout), ignore loadbusy so the button always works.
        filament_unload
        M118 O2S: (paused) filament_unload called (ignoring loadbusy)

      {% else %}
        # Original behavior: only unload if not already in a load/unload flow.
        {% if (loadbusy == 0) %}
          filament_unload
          M118 O2S: filament_unload called
        {% else %}
          M118 O2S: unload blocked (loadbusy=1). If this seems stuck, try again or check runout flow.
        {% endif %}
      {% endif %}

    {% else %}
      M118 O2S: Filament auto-unload is disabled in the sensor config file!
    {% endif %}
  {% endif %}


[gcode_macro filament_unload] 
gcode:
    {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
      {% if (sensor.enable_beep|lower == 'true') %} 
        M300 # beep sound
      {% endif %}
      M118 O2S: Unloading filament...    
      M83
      G92 E0     
      {% if (printer.extruder.can_extrude|lower != 'true')%} # Checking for minimum extrusion temperature
        # check if temperature is over the minimum extrusion temperature. min_extrude_temp must be defined in the extruder config (to about 185)        
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_unload_temp} # restore user temp if it was set before loading        
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={sensor.filament_unload_temp-1}  
      {% endif %}
      {% if(printer.extruder.target == 0) %} # Checking for set temperature if is zero than set to 185 / hotend hot but cooling due to set target temp 0            
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={sensor.filament_unload_temp} # restore user temp if it was set before loading        
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={sensor.filament_unload_temp-1} 
      {% endif %}
      G0 E10 F500 #push a bit out
      G0 E-15 F3600 	#retract filament to cold end
      G4 P7000 # wait for two, changed to 7, seconds
      G0 E12 F3600 # push the filament back, reduced to see if that fixes long string
      G0 E-12 F3600 	#extract filament to cold end
      G0 E-{sensor.unload_distance} F300	# continue extraction slowly and allow filament to be cooled enough before reaches the gears        Changed from 600 to 1800 to try to clean the tip
      M400 # wait to complete unload
      M118 O2S: Filament unload complete!   
      {% if (sensor.enable_beep|lower == 'true') %}
        M300 # beep sound
      {% endif %}


[gcode_macro filament_tangle] 
gcode:
  {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
  M118 O2S: Filament tangle detected, print paused!
  SET_DISPLAY_TEXT MSG="JAM detected - Check filament"
  {% if (sensor.enable_beep|lower == 'true') %} 
    M300 # beep sound
  {% endif %}
  PAUSE
    

#############################################END filament auto-unload macro section END***********************************************************

[delayed_gcode clear_unloadbusy]
gcode:
  SET_GCODE_VARIABLE MACRO=filament_unload VARIABLE=unloadbusy VALUE=0
  #M118 O2S: Clear Unload busy! 

[delayed_gcode clear_changebusy]
gcode:
  SET_GCODE_VARIABLE MACRO=filament_change_state1 VARIABLE=changebusy VALUE=0
  #M118 O2S: Clear Load busy!  

[delayed_gcode clear_loadbusy]
gcode:
  SET_GCODE_VARIABLE MACRO=unload_tangle_init VARIABLE=loadbusy VALUE=0
  #M118 O2S: Clear Load busy!  


