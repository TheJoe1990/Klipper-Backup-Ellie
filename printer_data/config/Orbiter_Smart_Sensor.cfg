[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set hs = printer["gcode_macro PRINT_START"].heatsoak_active|int %}
    {% if hs == 1 %}
      {action_respond_info("PAUSE: heatsoak-active pause; skipping park/retract/restore bookkeeping")}
      BASE_PAUSE
    {% else %}
      {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
      {% set x = params.X|default(sensor.park_position_x) %}
      {% set y = params.Y|default(sensor.park_position_y) %}
      {% set z = params.Z|default(sensor.park_lift_z)|float %}
      {% set e = params.E|default(sensor.park_retraction) %}
      {% set minT = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}

      ##### calculate safe lift position #####
      {% set max_z = printer.toolhead.axis_maximum.z|float %}
      {% set act_z = printer.toolhead.position.z|float %}
      {% set lift_z = z|abs %}
      {% if act_z < (max_z - lift_z) %}
          {% set z_safe = lift_z %}
      {% else %}
          {% set z_safe = max_z - act_z %}
      {% endif %}

      # Only record restore temps for a real pause
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=bed_restore_temp VALUE={printer.heater_bed.target}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_temp VALUE={printer.extruder.target}

      SAVE_GCODE_STATE NAME=PAUSE_state
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=pause_e VALUE={printer.gcode_move.gcode_position.e}
      SET_IDLE_TIMEOUT TIMEOUT={(sensor.pause_timeout)|float}

      BASE_PAUSE

      {% set homed = (printer.toolhead.homed_axes|lower == "xyz") %}
      {% if homed %}
        G91
        {% if printer.extruder.temperature >= minT %}
          G1 E-{e} F2100
        {% else %}
          {action_respond_info("PAUSE: skipping retract (nozzle below min_extrude_temp)")}
        {% endif %}
        G1 Z{z_safe}
        G90
        G1 X{x} Y{y} F6000
      {% else %}
        {action_respond_info("PAUSE: not homed; skipping park moves")}
      {% endif %}
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_bed_restore_temp: 0
variable_extruder_restore_temp: 0
variable_load_retract: 0
variable_pause_e: 0
gcode:
    # ======================================================================
    # PLAIN ENGLISH (Ellie):
    # - If this RESUME is happening during heatsoak, do the lightest resume
    #   (no temp restore / no E moves).
    # - Otherwise (real pause):
    #     1) Restore bed + nozzle targets and wait to reach them (your existing behavior)
    #     2) Unretract the normal pause retract (only if hot enough)
    #     3) Restore saved motion state and resume base
    # - NEW (minimal): if a filament load happened while paused mid-print,
    #   filament_load ends with a small anti-ooze retract and stores it in
    #   RESUME.load_retract. We "pay it back" here right before motion resumes
    #   to avoid a brief under-extrusion window.
    # ======================================================================

    {% set hs = printer["gcode_macro PRINT_START"].heatsoak_active|int %}
    {% if hs == 1 %}
      {action_respond_info("RESUME: heatsoak-active resume; skipping temp restore and E-move")}
      BASE_RESUME
    {% else %}
      {% set sensor = printer['gcode_macro _SENSOR_VARIABLES'] %}
      {% set minT = printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
      {% set e = params.E|default(sensor.park_retraction) %}

      M118 O2S: Restoring heaters temperature, it might take a while!
      M118 O2S: Restoring bed temperature...
      M140 S{bed_restore_temp}
      {% if bed_restore_temp|float > 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_restore_temp-1}
      {% endif %}

      M104 S{extruder_restore_temp}
      M118 O2S: Restoring extruder temperature...
      {% if extruder_restore_temp|float > 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_restore_temp-1}
      {% endif %}
      M118 O2S: Extruder temperature restored!

      KOMB RETRACT_BEFORE_WIPE=0 RETRACT_DURING_WIPE=0 RETRACT_AFTER_WIPE=0

      # Normal pause unretract (existing behavior, with min temp safety)
      {% if printer.extruder.temperature >= minT %}
        G91
        G1 E{e} F2100
        G90
      {% else %}
        {action_respond_info("RESUME: skipping unretract (nozzle below min_extrude_temp)")}
      {% endif %}

      SET_IDLE_TIMEOUT TIMEOUT=600

      # Sync E coordinate to pause value so RESTORE_GCODE_STATE does not move E
      G92 E{pause_e}
      # Restore saved gcode state (your current pattern)
      RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1

      # ---- NEW (minimal): pay back filament_load anti-ooze retract ----
      # This ensures that if FILAMENT_LOAD happened during a paused print,
      # we undo the small anti-ooze retract immediately before resuming motion.
      {% if load_retract|float > 0 %}
        {% if printer.extruder.temperature >= minT %}
          M118 O2S: RESUME paying back load retract: E{load_retract}
          G91
          G1 E{load_retract} F1200
          G90
        {% else %}
          {action_respond_info("RESUME: cannot pay back load retract (nozzle below min_extrude_temp)")}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=load_retract VALUE=0
      {% endif %}

      M118 O2S: Temperatures restored, resume printing!
      BASE_RESUME
    {% endif %}



[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:    
    CLEAR_PAUSE
    #SDCARD_RESET_FILE
    BASE_CANCEL_PRINT 
    SET_IDLE_TIMEOUT TIMEOUT=600 # restor klipper default printer timeout to 10 min

    
[gcode_macro M300]
gcode:
  # Plain English: Beep compatibility. Ellie/PanelDue beep isn't available, so ignore.
  # This prevents "Unknown command: M300" from filament/runout macros.
  {action_respond_info("M300 requested (beep), but no beeper is configured/available")}
