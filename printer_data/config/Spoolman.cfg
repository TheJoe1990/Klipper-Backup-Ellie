# Spoolman spool tracking (added 2026-10-08)
# - SET_ACTIVE_SPOOL / CLEAR_ACTIVE_SPOOL: standard Mainsail macros; tell Moonraker which spool is loaded.
# - _SPOOL_PROMPT: called at the end of the filament load macro; pops a Mainsail dialog listing the
#   spools in Spoolman (scripts/spoolman_prompt.py). Needs klippy/extras/gcode_shell_command.py (KIAUH).
# - Spoolman itself runs on Mom's Home Assistant: http://192.168.86.11:7912

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

[gcode_shell_command spoolman_prompt]
command: python3 /home/ellie/printer_data/config/scripts/spoolman_prompt.py http://192.168.86.11:7912
timeout: 5.
verbose: False

[gcode_macro _SPOOL_PROMPT]
gcode:
  RUN_SHELL_COMMAND CMD=spoolman_prompt

[gcode_macro _SPOOL_PICK]
gcode:
  SET_ACTIVE_SPOOL ID={params.ID|int}
  RESPOND TYPE=command MSG="action:prompt_end"
  M118 Spoolman: now tracking spool {params.ID|int}

[gcode_macro _SPOOL_SKIP]
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
