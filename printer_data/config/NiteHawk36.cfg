[mcu nitehawk]
serial: /dev/serial/by-id/usb-Klipper_rp2040_3232323236190A9E-if00
restart_method: command

# ======================================================================
# PLAIN ENGLISH EXPLAINER
# Ellie toolhead (Nitehawk-36 over USB):
# - Orbiter 2 extruder + Revo hotend
# - Same RP2040 gpio numbers as toolchanger T1 Nitehawk
# - Part fan, hotend fan, neopixel, activity LED, MCU temp, ADXL345
# ======================================================================



[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24
enable_pin: !nitehawk:gpio25
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 4.720466
nozzle_diameter: 0.400
filament_diameter: 1.750

heater_pin: nitehawk:gpio9
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200

min_temp: 0
max_temp: 300

max_extrude_only_distance: 500
max_extrude_cross_section: 200
max_extrude_only_velocity: 120

# control: pid
# pid_Kp: 26.056
# pid_Ki: 2.757
# pid_Kd: 61.559
# pressure_advance: 0.025
# pressure_advance_smooth_time: 0.03


[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
interpolate: false
run_current: 0.85
stealthchop_threshold: 0
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

# NOTE: keep ONE sense_resistor; choose the value you actually use.
# Most configs use 0.110 for many 2209 boards. If your toolchanger T1 is proven,
# use that same value here.
sense_resistor: 0.11


#####################################################################
#   Additional Sensors
#####################################################################
[temperature_sensor nitehawk_mcu]
sensor_type: temperature_mcu
sensor_mcu: nitehawk
min_temp: 0
max_temp: 100


#####################################################################
#   Fans
#####################################################################
[fan]
pin: nitehawk:gpio6


[heater_fan hotend_fan]
pin: nitehawk:gpio5
heater: extruder
heater_temp: 50.0
# tachometer_pin: nitehawk:gpio16
# tachometer_ppr: 2

[output_pin act_led]
pin: !nitehawk:gpio8


#####################################################################
#   Accelerometer
#####################################################################
[adxl345]
axes_map: -x, -z, -y
cs_pin: nitehawk:gpio27
spi_software_sclk_pin: nitehawk:gpio18
spi_software_mosi_pin: nitehawk:gpio20
spi_software_miso_pin: nitehawk:gpio19

[resonance_tester]
accel_chip: adxl345
probe_points: 175,175,20

# Reduce host load (important on Pi 3)
sweeping_accel: 200
sweeping_period: 0.5


[stepper_x]
endstop_pin: nitehawk:gpio13